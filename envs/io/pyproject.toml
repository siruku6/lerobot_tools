# 外部サービスとやり取りするための環境
#
# Usage
# ------
#   （envs/io/Dockerfile から venv_uv.sh 経由で呼ばれる）
#
# Effect
# ------
# HuggingFace と wandb に対して取得・送信ができ、評価で撮ったフレームを
# 動画に固められる venv が出来る。
#
#
# 何をするためのイメージか
# ------
# **学習も評価もしない。外との受け渡しだけをする。** 具体的には次の 4 つ。
#
#   - 評価結果（軌道・フレーム）を wandb へ送る
#   - HuggingFace からデータセットや重みを取る・上げる
#   - WANDB_MODE=offline で溜めた記録を後から同期する
#   - 作ったデータセットを push する
#
# GPU も torch も LIBERO も要らない。これらは「外と通信する」という
# 1 つの役割で括れるものであり、そのためだけに数 GB のイメージを起こさずに済む。
#
#
# なぜ train イメージに相乗りしないのか
# ------
# train は 13.9GB あり、GPU を要求する。wandb へ JSON と動画を送るだけの処理の
# ために起こすものではない。また wandb や huggingface_hub は更新が速いため、
# 同居させると小さなバージョン上げのたびに学習環境の作り直しを招く。
#
#
# なぜ eval イメージに wandb を入れないのか
# ------
# eval イメージの目的は**採点環境と同じ顔ぶれを保つこと**である。wandb は
# requests・psutil・pyyaml・protobuf といった、採点環境と共有している依存を
# 道連れに動かしうる。「ローカルで通って本番で落ちる」向きの食い違いを、
# それを避けるために作ったイメージの中で作ることになる。
#
# そのため評価側は結果をファイルに書くだけにして、送るのはこちらが受け持つ。
#
#
# なぜ torch が要らないのか
# ------
# 評価が書き出すのは numpy の配列（.npz）と JPEG であり、モデルを読み込まない。
# 軌道の点も画像も、送る時点ではただの数値と画素である。
[project]
name = "lerobot-tools-io"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    # --- wandb への送信 ---
    # **train イメージと同じバージョンに揃えてある。** 同じプロジェクトへ
    # 書き込む主体が 2 つあるので、片方だけが動くと記録の見た目が揃わなくなる。
    "wandb==0.27.2",

    # --- HuggingFace との受け渡し ---
    # **[hf_transfer] という extra は付けない。** 1.x には存在せず、指定すると
    # uv が「そんな extra は無い」と警告して黙って無視する（実測 2026-09-22）。
    # 大きなファイルの取得を速くする仕組みは hf_xet として本体が引いてくる。
    "huggingface_hub==1.32.0",

    # --- 評価結果を読んで可視化の形に直す ---
    # numpy: 評価が書いた .npz（軌道）を読む
    # Pillow: 評価が書いた JPEG を画素に戻す（動画に固める前段）
    #
    # **numpy のバージョンを eval や datagen と揃える必要は無い。** .npz は
    # バージョンをまたいで読める形式で、ここでは配列を読んで送るだけだからである。
    "numpy==2.5.3",
    "Pillow==12.3.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
