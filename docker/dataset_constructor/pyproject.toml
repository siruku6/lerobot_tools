[project]
name = "lerobot_tools-dataset_constructor"
version = "0.1.0"
description = "lerobot_tools-dataset_constructor"
requires-python = ">=3.10"

dependencies = [
    "bddl==3.6.0",
    "cloudpickle==3.1.2",
    "easydict==1.13",
    "einops==0.8.2",
    "fastapi==0.141.1",
    "gym==0.25.2",
    "h5py==3.16.0",
    "huggingface_hub==1.28.0",
    "hydra-core==1.3.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "msgpack==1.2.1",
    "mujoco==3.7.0",
    "numpy>=1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "robosuite==1.4.0",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "tensorboard>=2.19.0",
    "tensorboard-data-server>=0.7.2",
    "tensorboard-plugin-wit>=1.8.1",
    "termcolor>=3.3.0",
    "torch==2.11.0+cu130",
    "tqdm>=4.70.0",
    "uvicorn==0.52.4",
    "wand==0.7.2",
]


# >>> PyTorch の install 元を指定する ---------------------
# 他の版が必要な場合は URL を変更する
# 例えば、 cpu 版を使用する場合はこのようにする: https://download.pytorch.org/whl/cpu
# その他の例: https://download.pytorch.org/whl/cu113
[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
# --------------------- PyTorch の CPU 版を使用する - ここまで <<<